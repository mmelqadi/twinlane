[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twinlane"
version = "0.4.0"
description = "Run Claude Code and Codex together on included subscriptions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "twinlane contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/mmelqadi/twinlane"
Issues = "https://github.com/mmelqadi/twinlane/issues"

[project.scripts]
twinlane = "twinlane.cli:main"

[tool.setuptools.package-data]
twinlane = ["policy.json", "skill/SKILL.md"]
